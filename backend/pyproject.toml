[project]
name = "hris-backend"
version = "0.1.0"
description = "HRIS API for Philippine SMEs"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "beanie>=2.0",
  "pymongo>=4.13",
  "pydantic-settings>=2.6",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.10",
  "pyotp>=2.9",
  "qrcode>=8.0",
  "pillow>=11",
  "authlib>=1.3",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "cryptography>=44",
  "jinja2>=3.1",
  "weasyprint>=63",
  "pikepdf>=9",
  "openpyxl>=3.1",
  "python-dateutil>=2.9",
  "python-multipart>=0.0.17",
  "httpx>=0.28",
  "email-validator>=2.2",
  "aiosmtplib>=3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "hypothesis>=6.120",
  "time-machine>=2.16",
  "testcontainers[mongodb]>=4.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "seeds"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"seeds/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["migrations", "storage"]

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.core.money"]
strict = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["celery.*", "weasyprint.*", "pikepdf.*", "pyotp.*", "qrcode.*", "aiosmtplib.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = false
warn_required_dynamic_aliases = false
